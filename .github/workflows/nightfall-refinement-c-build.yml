name: Build Nightfall Reboot Refinement C

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Reconstruct clean Nightfall reboot baseline
        shell: bash
        run: |
          cat \
            nightfall_reboot_payload/part00.txt \
            nightfall_reboot_payload/part01.txt \
            nightfall_reboot_payload/part02.txt \
            nightfall_reboot_payload/part03.txt \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/nightfall-reboot-source.zip
          echo 'd87f26888ba9861f7370037bc924cce45fb6c0ecafe1a3365b0ce64bc3b159fe  /tmp/nightfall-reboot-source.zip' | sha256sum -c -
          rm -rf nightfall_reboot
          unzip -q /tmp/nightfall-reboot-source.zip
          test -f nightfall_reboot/build.gradle
          bash nightfall_reboot_payload/apply-fixes.sh

      - name: Apply Reboot B presentation baseline
        shell: bash
        run: |
          cat nightfall_art_payload/patch.gz.b64.00 nightfall_art_payload/patch.gz.b64.01 \
            | tr -d '[:space:]' | base64 -d | gzip -dc > /tmp/nightfall-artpass.patch
          patch --batch -p0 < /tmp/nightfall-artpass.patch
          grep -q '0.1.0-reboot-b' nightfall_reboot/gradle.properties
          test -f nightfall_reboot/src/main/java/dev/eternalskies/nightfall/registry/NightfallSounds.java

      - name: Generate Reboot B sound assets
        shell: bash
        run: |
          python3 -m pip install --disable-pip-version-check --quiet pillow numpy soundfile
          python3 nightfall_art_payload/paint_assets.py
          python3 nightfall_art_payload/make_sounds.py
          test -s nightfall_reboot/src/main/resources/assets/eternal_skies_nightfall/sounds/mob/duskborn/veil1.ogg
          test -s nightfall_reboot/src/main/resources/assets/eternal_skies_nightfall/sounds/mob/stormling/discharge.ogg

      - name: Apply refinement C code model and balance patch
        shell: bash
        run: |
          cat \
            nightfall_refine_c/patch.gz.b64.00 \
            nightfall_refine_c/patch.gz.b64.01 \
            nightfall_refine_c/patch.gz.b64.02 \
            | tr -d '[:space:]' | base64 -d | gzip -dc > /tmp/nightfall-refinement-c.patch
          echo '0c9203164f85a6f745579cdba4327ce3cf855aa6b5a608dcd083d15a5ce79232  /tmp/nightfall-refinement-c.patch' | sha256sum -c -
          patch --batch -p0 < /tmp/nightfall-refinement-c.patch
          rm -f nightfall_reboot/src/main/resources/data/eternal_skies_nightfall/forge/biome_modifier/add_duskborn.json
          rm -f nightfall_reboot/src/main/resources/data/eternal_skies_nightfall/forge/biome_modifier/add_stormling.json
          grep -q '0.1.0-reboot-c' nightfall_reboot/gradle.properties

      - name: Paint refined Duskborn and install refined Stormling textures
        shell: bash
        run: |
          TEX='nightfall_reboot/src/main/resources/assets/eternal_skies_nightfall/textures/entity'
          python3 nightfall_refine_c/paint_duskborn_refine_c.py
          tr -d '[:space:]' < nightfall_refine_c/stormling.png.b64 | base64 -d > "$TEX/stormling.png"
          tr -d '[:space:]' < nightfall_refine_c/stormling_glow.png.b64 | base64 -d > "$TEX/stormling_glow.png"
          sha256sum "$TEX/duskborn.png" "$TEX/duskborn_glow.png" "$TEX/stormling.png" "$TEX/stormling_glow.png"

      - name: Validate resources and refinement invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          from PIL import Image
          root = pathlib.Path('nightfall_reboot/src/main/resources')
          for path in root.rglob('*.json'):
              json.loads(path.read_text())
          tex = root / 'assets/eternal_skies_nightfall/textures/entity'
          for name, size in [('duskborn.png',(256,256)), ('duskborn_glow.png',(256,256)), ('stormling.png',(128,128)), ('stormling_glow.png',(128,128))]:
              with Image.open(tex / name) as im:
                  im.verify()
              with Image.open(tex / name) as im:
                  assert im.size == size, (name, im.size)
          assert not (root / 'data/eternal_skies_nightfall/forge/biome_modifier/add_duskborn.json').exists()
          data = json.loads((root / 'data/eternal_skies_nightfall/forge/biome_modifier/duskborn_spawns.json').read_text())
          assert data['spawners']['weight'] == 3
          print('JSON, PNG integrity/dimensions, and spawn invariants passed')
          PY

      - name: Build Forge mod
        working-directory: nightfall_reboot
        run: gradle --no-daemon --stacktrace clean build

      - name: Package exact validated source
        shell: bash
        run: |
          rm -f /tmp/EternalSkies-Nightfall-0.1.0-reboot-c-development-source.zip
          cd nightfall_reboot
          zip -qr /tmp/EternalSkies-Nightfall-0.1.0-reboot-c-development-source.zip . -x 'build/*' '.gradle/*'

      - name: Upload Nightfall refinement C JAR
        uses: actions/upload-artifact@v4
        with:
          name: EternalSkies-Nightfall-0.1.0-reboot-c-refinement-forge-1.20.1
          path: nightfall_reboot/build/libs/*.jar
          if-no-files-found: error

      - name: Upload exact validated source
        uses: actions/upload-artifact@v4
        with:
          name: EternalSkies-Nightfall-0.1.0-reboot-c-development-source
          path: /tmp/EternalSkies-Nightfall-0.1.0-reboot-c-development-source.zip
          if-no-files-found: error
