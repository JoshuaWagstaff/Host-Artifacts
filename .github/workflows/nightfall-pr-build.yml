name: Build Nightfall from PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Reconstruct and validate Nightfall source
        shell: bash
        run: |
          cat \
            nightfall_payload/part00.txt \
            nightfall_payload/part01.txt \
            nightfall_payload/part02.txt \
            nightfall_payload/part03.txt \
            nightfall_payload/part04.txt \
            nightfall_payload/part05.txt \
            nightfall_payload/part06.txt \
            nightfall_payload/part07.txt \
            nightfall_payload/v2_00.txt \
            nightfall_payload/v2_01.txt \
            nightfall_payload/v2_02.txt \
            nightfall_payload/v2_03.txt \
            nightfall_payload/v2_04.txt \
            nightfall_payload/v2_05.txt \
            nightfall_payload/v2_06.txt \
            nightfall_payload/v2_07.txt \
            nightfall_payload/v2_08.txt \
            nightfall_payload/v2_09.txt \
            nightfall_payload/v2_10.txt \
            nightfall_payload/v2_11.txt \
            nightfall_payload/v2_12.txt \
            nightfall_payload/v2_13.txt \
            nightfall_payload/v2_14.txt \
            nightfall_payload/v2_15.txt \
            | tr -d '[:space:]' \
            | base64 -d > EternalSkies-Nightfall-0.1K-development-source.zip
          set +e
          unzip -t EternalSkies-Nightfall-0.1K-development-source.zip >/tmp/nightfall-zip-test.log 2>&1
          ZIP_TEST=$?
          cat /tmp/nightfall-zip-test.log
          set -e
          if [ "$ZIP_TEST" -gt 1 ]; then exit "$ZIP_TEST"; fi
          rm -rf nightfall-build
          set +e
          unzip -q EternalSkies-Nightfall-0.1K-development-source.zip -d nightfall-build
          ZIP_EXTRACT=$?
          set -e
          if [ "$ZIP_EXTRACT" -gt 1 ]; then exit "$ZIP_EXTRACT"; fi
          test -f nightfall-build/nightfall_01k/build.gradle

      - name: Apply Forge 1.20.1 compatibility fixes
        shell: bash
        run: |
          FILE=nightfall-build/nightfall_01k/src/main/java/dev/eternalskies/nightfall/entity/DuskbornEntity.java
          sed -i 's/import net.minecraft.world.entity.ai.goal.AvoidSunGoal;/import net.minecraft.world.entity.ai.goal.FleeSunGoal;/' "$FILE"
          sed -i 's/new AvoidSunGoal(this)/new FleeSunGoal(this, 1.05D)/' "$FILE"
          grep -nE 'RestrictSunGoal|FleeSunGoal' "$FILE"

      - name: Build Forge mod
        working-directory: nightfall-build/nightfall_01k
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload Nightfall JAR
        uses: actions/upload-artifact@v4
        with:
          name: EternalSkies-Nightfall-0.1K-forge-1.20.1
          path: nightfall-build/nightfall_01k/build/libs/*.jar
          if-no-files-found: error
