name: Build Nightfall Reboot

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.1.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Reconstruct fresh Nightfall source
        shell: bash
        run: |
          cat \
            nightfall_reboot_payload/part00.txt \
            nightfall_reboot_payload/part01.txt \
            nightfall_reboot_payload/part02.txt \
            nightfall_reboot_payload/part03.txt \
            | tr -d '[:space:]' \
            | base64 -d > /tmp/nightfall-reboot-source.zip
          echo 'd87f26888ba9861f7370037bc924cce45fb6c0ecafe1a3365b0ce64bc3b159fe  /tmp/nightfall-reboot-source.zip' | sha256sum -c -
          rm -rf nightfall_reboot
          unzip -q /tmp/nightfall-reboot-source.zip
          test -f nightfall_reboot/build.gradle

      - name: Validate resource JSON
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib
          for path in pathlib.Path('nightfall_reboot/src/main/resources').rglob('*.json'):
              json.loads(path.read_text())
          print('JSON validation passed')
          PY

      - name: Build Forge mod
        working-directory: nightfall_reboot
        run: gradle --no-daemon --stacktrace clean build

      - name: Upload Nightfall reboot JAR
        uses: actions/upload-artifact@v4
        with:
          name: EternalSkies-Nightfall-0.1.0-reboot-a-forge-1.20.1
          path: nightfall_reboot/build/libs/*.jar
          if-no-files-found: error
